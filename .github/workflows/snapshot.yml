name: Daily snapshot

on:
  schedule:
    # 06:00 UTC daily. GitHub schedules are best-effort and can be delayed or
    # dropped under load; daily cadence is what makes a dropped run harmless.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -v

  snapshot:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Capture
        id: capture
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python tools/snapshot_top_items.py

      - name: Enrich new artists
        # always(): a partial capture still produced artists worth resolving.
        # continue-on-error: MusicBrainz and Deezer are free community services.
        # If either is down, yesterday's cache is still on disk and the pipeline
        # carries on with what it has. Enrichment is an improvement, not a
        # dependency — losing a day of it costs nothing permanent, unlike a
        # missed capture.
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: python tools/enrich_artists.py

      - name: Rebuild derived tables and metrics
        if: always()
        run: |
          python tools/build_derived.py
          python tools/build_metrics.py

      - name: Commit whatever was captured
        # always(): a partial capture still wrote real data worth keeping, and
        # the capture step still reports failure so the notification goes out.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          git diff --staged --quiet || git commit -m "data: snapshot $(date -u +%F)"
          git push

  deploy:
    needs: snapshot
    # always(): a partial capture should still publish the data that arrived.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Pick up the commit the snapshot job just pushed, not the SHA this
          # workflow started from.
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
